name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: KB integrity gate (schema, provenance, checksums, article refs)
        run: npx tsx scripts/validate-kb.ts

      - name: Documentation link check
        run: npx tsx scripts/check-doc-links.ts
